<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#294f3b"><meta name="description" content="Turn your Arabic word pictures into a personal translation quiz. Upload, learn, shuffle, repeat."><title>Kalima — A little practice, a lot of progress.</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
